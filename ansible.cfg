# =============================================================================
# Ansible Configuration for NetBox Arista ContainerLab Demo
# =============================================================================

[defaults]
# Inventory
inventory = inventory/netbox.yml

# Roles path
roles_path = roles

# Output formatting
stdout_callback = default
result_format = yaml
callbacks_enabled = profile_tasks

# Host key checking (disable for lab)
host_key_checking = False

# Retry files
retry_files_enabled = False

# Gathering facts
gathering = smart
fact_caching = memory

# Interpreter
interpreter_python = auto_silent

# Timeout
timeout = 30

# Forks (parallel execution)
forks = 10

# Display options
display_skipped_hosts = False
display_ok_hosts = True

# =============================================================================
# Privilege Escalation
# =============================================================================
[privilege_escalation]
become = True
become_method = enable

# =============================================================================
# SSH Connection
# =============================================================================
[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True

# =============================================================================
# Persistent Connection (for network devices)
# =============================================================================
[persistent_connection]
command_timeout = 60
connect_timeout = 30
connect_retry_timeout = 15

# =============================================================================
# Inventory Plugins
# =============================================================================
[inventory]
enable_plugins = netbox.netbox.nb_inventory, host_list, yaml, ini, auto

