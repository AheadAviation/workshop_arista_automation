---
# =============================================================================
# Arista Config Generation Role - Main Tasks
# =============================================================================
# This role generates Arista EOS configurations from NetBox data
# Uses modular Jinja2 templates ported from mceos for production-grade configs
# =============================================================================

- name: Set device role fact
  ansible.builtin.set_fact:
    device_role: "{{ device_roles[0] | default('unknown') }}"
  when: device_roles is defined and device_roles | length > 0

- name: Set device role fact (fallback)
  ansible.builtin.set_fact:
    device_role: "unknown"
  when: device_roles is not defined or device_roles | length == 0

- name: Extract custom fields
  ansible.builtin.set_fact:
    bgp_asn: "{{ custom_fields.bgp_asn | default(65000) }}"
    router_id: "{{ custom_fields.router_id | default('') }}"
    vtep_ip: "{{ custom_fields.vtep_ip | default('') }}"
    switch_id: "{{ custom_fields.switch_id | default(1) }}"
    mlag_index: "{{ custom_fields.mlag_index | default(0) }}"
    mlag_name: "{{ custom_fields.mlag_name | default('') }}"
  when: custom_fields is defined

- name: Display device information
  ansible.builtin.debug:
    msg: |
      Device: {{ inventory_hostname }}
      Role: {{ device_role | default('unknown') }}
      BGP ASN: {{ bgp_asn | default('not set') }}
      Router ID: {{ router_id | default('not set') }}
      VTEP IP: {{ vtep_ip | default('not set') }}
      Switch ID: {{ switch_id | default('not set') }}
      MLAG Index: {{ mlag_index | default('not set') }}

- name: Ensure output directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0777'
  delegate_to: localhost
  run_once: true
  failed_when: false
  loop:
    - "{{ config_output_dir }}"
    - "{{ output_dir }}/network_state"

- name: Gather interface data from NetBox
  ansible.builtin.set_fact:
    device_interfaces: "{{ interfaces | default([]) }}"

- name: Set config context reference
  ansible.builtin.set_fact:
    netbox_config_context: "{{ hostvars[inventory_hostname] }}"

- name: Set management settings from flattened context
  ansible.builtin.set_fact:
    mgmt_vrf: "{{ management.vrf | default('MGMT') }}"
    mgmt_gateway: "{{ management.gateway | default(clab_mgmt_gateway) }}"
    ntp: "{{ ntp | default({'servers': fabric_defaults.ntp_servers, 'vrf': 'MGMT', 'interface': 'Management0'}) }}"
    dns: "{{ dns | default({'servers': fabric_defaults.dns_servers}) }}"
  when: management is defined

- name: Set default management settings
  ansible.builtin.set_fact:
    mgmt_vrf: "MGMT"
    mgmt_gateway: "{{ clab_mgmt_gateway }}"
    ntp:
      servers: "{{ fabric_defaults.ntp_servers }}"
      vrf: "MGMT"
      interface: "Management0"
    dns:
      servers: "{{ fabric_defaults.dns_servers }}"
  when: management is not defined

- name: Initialize tenants if not set
  ansible.builtin.set_fact:
    tenants: "{{ tenants | default([]) }}"

- name: Initialize EVPN peers if not set from context
  ansible.builtin.set_fact:
    evpn_peers: []

- name: Fetch peer devices for EVPN overlay
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/dcim/devices/?role={{ 'leaf' if device_role == 'spine' else 'spine' }}&limit=100"
    headers:
      Authorization: "Token {{ netbox_token }}"
    return_content: true
  register: evpn_peer_devices
  delegate_to: localhost
  when: device_role in ['spine', 'leaf']

- name: Initialize EVPN peers list
  ansible.builtin.set_fact:
    evpn_peers: []
  when: device_role in ['spine', 'leaf']

- name: Build EVPN overlay peers list
  ansible.builtin.set_fact:
    evpn_peers: "{{ evpn_peers + [{'name': item.name, 'loopback_ip': item.custom_fields.router_id, 'asn': item.custom_fields.bgp_asn}] }}"
  loop: "{{ evpn_peer_devices.json.results | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - device_role in ['spine', 'leaf']
    - evpn_peer_devices is defined
    - item.custom_fields.router_id is defined
    - item.custom_fields.router_id | default('') | length > 0

- name: Initialize interface IP mapping
  ansible.builtin.set_fact:
    interface_ips: {}
    interfaces_info: {}

- name: Build interface IP mapping from interfaces
  ansible.builtin.set_fact:
    interface_ips: >-
      {{
        interface_ips | combine({
          item.name: item.ip_addresses[0].address
        })
      }}
    interfaces_info: >-
      {{
        interfaces_info | combine({
          item.name: {
            'description': item.description | default(''),
            'enabled': item.enabled | default(true),
            'type': item.type.value | default('other')
          }
        })
      }}
  loop: "{{ device_interfaces }}"
  when:
    - item.ip_addresses is defined
    - item.ip_addresses | length > 0
  loop_control:
    label: "{{ item.name | default('unknown') }}"

- name: Display interface IPs found
  ansible.builtin.debug:
    msg: "Interface IPs: {{ interface_ips }}"
    verbosity: 1

- name: Initialize BGP neighbors list
  ansible.builtin.set_fact:
    bgp_neighbors: []

# Use Python ipaddress for proper peer IP calculation
- name: Calculate BGP neighbors using Python
  ansible.builtin.set_fact:
    bgp_neighbors: "{{ lookup('template', 'calculate_bgp_neighbors.j2') | from_yaml }}"

- name: Display BGP neighbors
  ansible.builtin.debug:
    msg: "BGP Neighbors: {{ bgp_neighbors }}"
    verbosity: 1

- name: Generate device configuration using modular templates
  ansible.builtin.template:
    src: sections/base.j2
    dest: "{{ config_output_dir }}/{{ inventory_hostname }}.cfg"
    mode: '0644'
  delegate_to: localhost

- name: Display generated config path
  ansible.builtin.debug:
    msg: "Config generated: {{ config_output_dir }}/{{ inventory_hostname }}.cfg"
