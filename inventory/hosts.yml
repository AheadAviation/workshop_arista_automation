---
# =============================================================================
# Static Inventory for Testing
# =============================================================================
# Use this inventory when NetBox dynamic inventory can't resolve hosts
# Maps device names to their management IPs in the ContainerLab network
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/test_all.yml
# =============================================================================

all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

  children:
    # Network devices group
    network:
      vars:
        ansible_network_os: arista.eos.eos
        ansible_connection: ansible.netcommon.network_cli
        ansible_user: admin
        ansible_password: admin
        ansible_become: true
        ansible_become_method: enable
      children:
        spine: {}
        leaf: {}

    spine:
      hosts:
        spine-01:
          ansible_host: 172.30.30.11
        spine-02:
          ansible_host: 172.30.30.12

    leaf:
      hosts:
        leaf-01:
          ansible_host: 172.30.30.21
        leaf-02:
          ansible_host: 172.30.30.22
        leaf-03:
          ansible_host: 172.30.30.23
        leaf-04:
          ansible_host: 172.30.30.24

    # Device role groups (matches NetBox)
    device_roles_spine:
      children:
        spine: {}

    device_roles_leaf:
      children:
        leaf: {}

    # MLAG pairs
    mlag_pair_1:
      hosts:
        leaf-01: {}
        leaf-02: {}

    mlag_pair_2:
      hosts:
        leaf-03: {}
        leaf-04: {}

