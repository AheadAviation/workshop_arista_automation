# =============================================================================
# Python Project Configuration
# =============================================================================

[project]
name = "netbox-arista-lab"
version = "2.0.0"
description = "NetBox + Arista Lab Workshop - Source of Truth automation demo"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ahead Aviation", email = "automation@aheadaviation.com"}
]
keywords = ["netbox", "arista", "ansible", "network-automation", "containerlab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Networking",
]

dependencies = [
    "pynetbox>=7.3.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "requests>=2.31",
    "netaddr>=0.10",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "pytest",
    "ansible-lint",
    "yamllint",
    "j2lint",
]

[project.urls]
Homepage = "https://github.com/AheadAviation/workshop_arista_automation"
Repository = "https://github.com/AheadAviation/workshop_arista_automation.git"
Issues = "https://github.com/AheadAviation/workshop_arista_automation/issues"

# =============================================================================
# Ruff Configuration (Python Linter)
# =============================================================================

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "W191",   # indentation contains tabs
    "E111",   # indentation is not a multiple of four
    "E114",   # indentation is not a multiple of four (comment)
    "E117",   # over-indented
    "ARG001", # unused function argument (common in Ansible filters)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"filter_plugins/*.py" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["scripts", "filter_plugins"]

# =============================================================================
# Black Configuration (Python Formatter)
# =============================================================================

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.github
  | \.venv
  | venv
  | output
  | clab
  | __pycache__
)/
'''

# =============================================================================
# Pytest Configuration
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

