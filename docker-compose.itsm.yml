# =============================================================================
# Zammad — a real ITSM stack for the NetBox Ops plugin (INIT-002/SPEC-006).
# =============================================================================
# Started only with `--profile itsm`, and always alongside the main file:
#
#   docker compose -f docker-compose.yml -f docker-compose.itsm.yml --profile itsm up -d
#
# or simply `.\\run.ps1 itsm`.
#
# **Both files, and the order matters.** Zammad is defined here, so `--profile itsm` against
# docker-compose.yml alone starts nothing. But this file alone puts Zammad on
# `workshop_arista_automation_default` while NetBox is on `netbox-arista-lab` — and the
# plugin's call to `http://zammad-nginx:8080` then cannot resolve, so the Tickets tab says
# "ITSM is not configured" while Zammad is plainly running on the host port. Passing both
# files merges them onto the main file's named network, which is where the plugin looks.
#
# Zammad normally ships with Elasticsearch; it is disabled here because it is the single
# heaviest component and search is not what the demo shows. Zammad runs fine without it for
# ticket creation and viewing.
#
# First start is slow — several minutes, because it runs its database migrations and seed.
# The plugin reports "starting" rather than showing an empty ticket list, because an empty
# list reads as "your ITSM has no tickets" which is a very different and much more alarming
# thing to show a customer.
#
# Bring up:   docker compose --profile itsm up -d
# Tear down:  docker compose --profile itsm down
#             (note: no -v. `down -v` on this project removes NetBox's volumes too, which
#              wipes the source of truth. That mistake cost an hour once.)
# =============================================================================

services:
  zammad-postgres:
    image: postgres:15-alpine
    profiles: ["itsm"]
    environment:
      POSTGRES_DB: zammad_production
      POSTGRES_USER: zammad
      POSTGRES_PASSWORD: zammad
    volumes:
      - zammad-postgres:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - zammad-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zammad"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  zammad-redis:
    image: redis:7-alpine
    profiles: ["itsm"]
    networks:
      default:
        aliases:
          - zammad-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Zammad's init job: creates the schema and seeds the admin user, then exits.
  zammad-init:
    image: ghcr.io/zammad/zammad:6.4.1
    profiles: ["itsm"]
    depends_on:
      zammad-postgres:
        condition: service_healthy
      zammad-redis:
        condition: service_healthy
    command: ["zammad-init"]
    environment:
      POSTGRESQL_HOST: zammad-postgres
      POSTGRESQL_USER: zammad
      POSTGRESQL_PASS: zammad
      POSTGRESQL_DB: zammad_production
      REDIS_URL: redis://zammad-redis:6379
      # Zammad's entrypoint waits for Elasticsearch unless this is explicitly false. There is
      # no Elasticsearch in this stack (it is the heaviest component and search is not what the
      # demo shows), so without this the railsserver blocks forever on
      # 'waiting for elasticsearch server to be ready'.
      ELASTICSEARCH_ENABLED: "false"
    networks:
      default:
        aliases:
          - zammad-init
    restart: "no"

  # ==========================================================================
  # Zammad first-run setup lives in `scripts/zammad_setup.py`, not here.
  # ==========================================================================
  # It was tried as a one-shot service in this file and it races: on a cold database it can
  # start while `zammad-init` is still migrating, find no schema, and give up. Depending on
  # timing it either fails immediately or appears to succeed against a half-built database.
  #
  # Running it from the host against the long-lived railsserver removes that race, because the
  # retry loop waits for the schema instead of assuming it. `docker compose` cannot express
  # "wait until this service's database has tables"; a loop can.
  #
  # Also note why AUTOWIZARD_JSON is not used, since it looks like the obvious tool:
  #
  #   * It must be **base64**. The entrypoint runs `base64 -d <<< "$VAR"` and only writes the
  #     wizard file if that succeeds, so plain JSON is skipped silently. The stack comes up
  #     healthy, migrations run, and the UI still shows "Set up a new system" -- which is
  #     exactly what happened here.
  #   * It only runs when the database has no users at all, so it can never repair an install
  #     that booted once without it.
  #   * Even on success it does not set `system_init_done`; that is done by a *web* endpoint the
  #     browser calls, so the wizard stays on screen regardless.
  #
  # Use `.\run.ps1 itsm`, which brings the stack up and then runs the setup.

  zammad-railsserver:
    image: ghcr.io/zammad/zammad:6.4.1
    profiles: ["itsm"]
    depends_on:
      zammad-postgres:
        condition: service_healthy
      zammad-redis:
        condition: service_healthy
      # Only the database and cache gate this. `service_completed_successfully` on zammad-init
      # looked right and was not: with `restart: "no"` the init container still reports "Up"
      # while it finishes, so the condition never resolves and railsserver never starts.
      # Migrations are idempotent, so running this before init has fully exited is safe.
    command: ["zammad-railsserver"]
    environment:
      POSTGRESQL_HOST: zammad-postgres
      POSTGRESQL_USER: zammad
      POSTGRESQL_PASS: zammad
      POSTGRESQL_DB: zammad_production
      REDIS_URL: redis://zammad-redis:6379
      # Zammad's entrypoint waits for Elasticsearch unless this is explicitly false. There is
      # no Elasticsearch in this stack (it is the heaviest component and search is not what the
      # demo shows), so without this the railsserver blocks forever on
      # 'waiting for elasticsearch server to be ready'.
      ELASTICSEARCH_ENABLED: "false"
      RAILS_ENV: production
    volumes:
      - zammad-storage:/opt/zammad/storage
    networks:
      default:
        aliases:
          - zammad-railsserver
    restart: unless-stopped

  zammad-websocket:
    image: ghcr.io/zammad/zammad:6.4.1
    profiles: ["itsm"]
    depends_on:
      - zammad-railsserver
    command: ["zammad-websocket"]
    environment:
      POSTGRESQL_HOST: zammad-postgres
      POSTGRESQL_USER: zammad
      POSTGRESQL_PASS: zammad
      POSTGRESQL_DB: zammad_production
      REDIS_URL: redis://zammad-redis:6379
      # Zammad's entrypoint waits for Elasticsearch unless this is explicitly false. There is
      # no Elasticsearch in this stack (it is the heaviest component and search is not what the
      # demo shows), so without this the railsserver blocks forever on
      # 'waiting for elasticsearch server to be ready'.
      ELASTICSEARCH_ENABLED: "false"
      RAILS_ENV: production
    networks:
      default:
        aliases:
          - zammad-websocket
    restart: unless-stopped

  zammad-nginx:
    image: ghcr.io/zammad/zammad:6.4.1
    profiles: ["itsm"]
    depends_on:
      - zammad-railsserver
    command: ["zammad-nginx"]
    environment:
      POSTGRESQL_HOST: zammad-postgres
      POSTGRESQL_USER: zammad
      POSTGRESQL_PASS: zammad
      POSTGRESQL_DB: zammad_production
      REDIS_URL: redis://zammad-redis:6379
      # Zammad's entrypoint waits for Elasticsearch unless this is explicitly false. There is
      # no Elasticsearch in this stack (it is the heaviest component and search is not what the
      # demo shows), so without this the railsserver blocks forever on
      # 'waiting for elasticsearch server to be ready'.
      ELASTICSEARCH_ENABLED: "false"
      RAILS_ENV: production
      NGINX_SERVER_SCHEME: http
      NGINX_SERVER_NAME: localhost
      NGINX_PORT: "8080"
    ports:
      # Loopback only: this drives real ticket state.
      - "127.0.0.1:8090:8080"
    networks:
      default:
        aliases:
          - zammad-nginx
    restart: unless-stopped

volumes:
  zammad-postgres:
  zammad-storage:
