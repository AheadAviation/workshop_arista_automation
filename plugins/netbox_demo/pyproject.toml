[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-demo"
version = "0.1.0"
description = "Run a local ContainerLab fabric from NetBox Cloud, with discovery and assurance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AHEAD" }]
keywords = ["netbox", "netbox-plugin", "containerlab", "arista", "evpn"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/AheadAviation/netbox-demo"
Issues = "https://github.com/AheadAviation/netbox-demo/issues"

[tool.setuptools]
packages = ["netbox_demo", "netbox_demo.api"]

[tool.setuptools.package-data]
netbox_demo = [
    "templates/**/*.html",
    "static/**/*",
    "migrations/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
