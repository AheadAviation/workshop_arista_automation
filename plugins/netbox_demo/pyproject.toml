[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-demo"
version = "0.2.2"
description = "Run a ContainerLab / Clabernetes fabric from NetBox, with Discovery and Assurance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AHEAD" }]
keywords = ["netbox", "netbox-plugin", "containerlab", "arista", "evpn"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/AheadAviation/netbox-demo"
Issues = "https://github.com/AheadAviation/netbox-demo/issues"

[project.entry-points."netbox.plugins"]
netbox_demo = "netbox_demo:config"

[tool.setuptools]
packages = ["netbox_demo", "netbox_demo.api"]

[tool.setuptools.package-data]
netbox_demo = [
    "templates/**/*.html",
    "static/**/*",
    "migrations/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
