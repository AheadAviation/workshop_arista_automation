[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-ops"
version = "0.1.0"
description = "Day-two network operations inside NetBox: devices, labs, changes, approvals, AWX and ITSM"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "AHEAD" }]
dependencies = []

[tool.setuptools]
packages = ["netbox_ops"]

[tool.setuptools.package-data]
netbox_ops = ["templates/**/*.html", "static/**/*"]
