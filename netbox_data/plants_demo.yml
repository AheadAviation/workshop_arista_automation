# -----------------------------------------------------------------------------
# Ticket history (SAMPLE). What the team's ticket system would already know:
# past incidents and what fixed them. Alerts count these as earlier incidents
# and quote the fix. Ages are days before "now", so the sample never goes stale.
# -----------------------------------------------------------------------------
incident_history:
  - {id: ZD-48211, device: us-plt3-fw01, days_ago: 4, alert: "Uplink status changed", circuit: WIN-TUL-88213, by: Sam Whitaker, fix: "Windstream fibre cut on Frontier Blvd. Ran on the LTE backup for 5 hours; Windstream ticket WS-T-77120."}
  - {id: ZD-47630, device: us-plt3-fw01, days_ago: 13, alert: "Uplink status changed", circuit: WIN-TUL-88213, by: Sam Whitaker, fix: "Windstream line card failure at the central office. Restored after 3 hours; Windstream ticket WS-T-76402."}
  - {id: ZD-46977, device: us-plt3-fw01, days_ago: 24, alert: "Uplink status changed", circuit: WIN-TUL-88213, by: Marcus Lee, fix: "Windstream planned maintenance nobody was told about. Asked Windstream to add the service desk to their notices."}
  - {id: ZD-47102, device: us-plt3-ap02, days_ago: 11, alert: "APs went down", by: Sam Whitaker, fix: "us-plt3-sw01 ran out of PoE budget after a camera was added. Moved the camera to us-plt3-sw02."}

# -----------------------------------------------------------------------------
# Network scan (cli.py scan, MOCK). The mock answers for every address NetBox
# records at the site, except the devices under `silent`, plus the `extra`
# hosts nobody wrote down. The vendor is what the MAC prefix would say.
# -----------------------------------------------------------------------------
scan_mock:
  silent: [mx-plt1-srv-old02, us-dc2-ap02]
  extra:
    us-hq:
      - {ip: 10.1.100.40, mac: "00:80:f4:3a:19:40", vendor: "Schneider Electric", ports: [502]}
    us-plt2:
      - {ip: 10.2.100.57, mac: "00:1d:9c:4a:10:57", vendor: "Rockwell Automation", ports: [44818]}
      - {ip: 10.2.100.58, mac: "00:0e:8c:22:7b:01", vendor: "Siemens", ports: [102]}
      - {ip: 10.2.10.140, mac: "b8:27:eb:5d:11:9a", vendor: "Raspberry Pi", hostname: pi-scoreboard, ports: [22, 80]}
    mx-plt1:
      - {ip: 10.7.100.31, mac: "00:1d:9c:7e:02:31", vendor: "Rockwell Automation", ports: [44818]}
      - {ip: 10.7.10.77, mac: "50:c7:bf:08:4d:77", vendor: "TP-Link", ports: [80, 443]}

# -----------------------------------------------------------------------------
# Monitoring for the gear the Meraki dashboard cannot see (cli.py alert poll,
# MOCK). Every Juniper and Ubiquiti device answers unless it is listed here or
# marked down with `alert poll --simulate-down`.
# -----------------------------------------------------------------------------
monitor_mock:
  unreachable: []
  uplink_alert_pct: 80  # open a ticket when a primary circuit runs this full

# -----------------------------------------------------------------------------
# Audit policy. Network gear may inherit its site's owner/approver; anything
# else (servers, OT machines) must have an explicit device-level owner, because
# "the plant manager" is not an answer to "who owns this server?".
# -----------------------------------------------------------------------------
audit:
  site_inherit_roles: [firewall, access-switch, wireless-ap, spine, leaf, border]

# -----------------------------------------------------------------------------
# Spreadsheet import (cli.py import-sheet). How the free text in an asset
# register maps onto NetBox. Matching ignores case and punctuation and works on
# whole words. Edit these to fit a real sheet; values that match nothing are
# reported to the user, never guessed.
# -----------------------------------------------------------------------------
sheet_import:
  tag: spreadsheet-import
  source_system: spreadsheet
  # Sheet "Model" text -> device type key (see device_types). Text that contains a
  # device type's model name ("Dell PowerEdge R650") matches without an entry here.
  model_aliases:
    optiplex: hmi-workstation
    precision: hmi-workstation
  # Sheet "OS" text -> platform slug. First match wins.
  platform_aliases:
    xp: windows-xp
    winxp: windows-xp
    win 7: windows-7
    win7: windows-7
    windows 7: windows-7
    win 10: windows-10
    win10: windows-10
    windows 10: windows-10
    2012 r2: windows-server-2012-r2
    "2016": windows-server-2016
    "2019": windows-server-2019
    "2022": windows-server-2022
  # Sheet "Status" text -> NetBox device status.
  status_aliases:
    active: active
    in use: active
    live: active
    production: active
    spare: inventory
    stock: inventory
    planned: planned
    ordered: planned
    retired: decommissioning
    decommissioned: decommissioning
    scrap: decommissioning
  # NetBox does not know an operating system's end-of-life date, so it comes from here.
  eol_dates:
    windows-xp: "2014-04-08"
    windows-7: "2020-01-14"
    windows-10: "2025-10-14"
    windows-server-2012-r2: "2023-10-10"
    windows-server-2016: "2027-01-12"
    windows-server-2019: "2029-01-09"
    windows-server-2022: "2031-10-14"

# -----------------------------------------------------------------------------
# Mock Meraki dashboard (cli.py meraki-sync / meraki-mock). The mock serves the
# Meraki-managed devices above, as the dashboard would report them, plus the
# differences below so the sync has something to find. Every device named here
# must exist in the sample data (the mock refuses to start otherwise).
# Firmware strings are opaque text to the sync; the wireless form is the one used
# in Meraki's API documentation.
# -----------------------------------------------------------------------------
meraki_mock:
  org: {id: "999001", name: "Summit Door Works (mock)"}
  firmware:
    current: {appliance: wired-18-211-2, switch: switch-16-8, wireless: wireless-30-6}
    behind:  # device -> firmware it is stuck on
      us-hq-sw02: switch-15-21-1
      uk-plt1-ap01: wireless-29-7
      mx-plt2-fw01: wired-17-10-2
  status:  # device -> availability reported by the dashboard (default online)
    us-plt3-ap02: offline
    mx-plt1-ap04: offline
    ca-plt1-ap04: dormant
    nz-dc1-ap02: alerting
  lan_ip:  # device -> address the dashboard reports (NetBox says otherwise)
    us-plt2-sw01: 10.2.99.19
  network:  # device -> site whose dashboard network it is really in
    us-plt3-ap04: us-plt2
  model:  # device -> model the dashboard reports (NetBox says otherwise)
    us-plt3-sw02: MS225-48LP
  removed: [us-dc2-ap02]  # still in NetBox, gone from the dashboard
  extra:  # in the dashboard, not (necessarily) in NetBox. Serials match the sample spreadsheet.
    - {name: GVL-PACK-SW01, site: us-plt2, model: MS120-24P, serial: Q2KD-4F2A-91BC, lan_ip: 10.2.99.60}
    - {name: MEM-SW02, site: us-dc1, model: MS120-24P, serial: Q2LB-1D90-7E22, lan_ip: 10.4.99.60}
    - {name: MEM-SW03, site: us-dc1, model: MS120-24P, serial: Q2LB-5C41-02AF, lan_ip: 10.4.99.61}
    - {name: CA-PLT1-AP05, site: ca-plt1, model: MR46, serial: Q2NW-7H3K-91PA, lan_ip: 10.6.99.25}
    - {name: US-PLT2-CAM01, site: us-plt2, model: MV12W, serial: Q2GV-3C8D-55QZ, lan_ip: 10.2.99.80, product_type: camera, firmware: camera-5-2}
  dhcp:  # the MX's DHCP scopes (GET /devices/{serial}/appliance/dhcp/subnets)
    vlans: [10, 20, 30, 100]  # MGMT and SERVERS are static
    pool: 152                 # leasable addresses per /24; .100-.199 is the static range
    relay: [us-hq]            # a Windows server does DHCP here; the MX only relays
    used:                     # site -> {vlan: leases in use}; the rest sit at 20-60%
      us-plt2: {100: 149, 30: 126}
  clients:  # access point -> wireless clients connected (default: 5-24)
    us-plt2-ap01: 31
  uplinks:  # site -> % of its primary circuit in use (GET /networks/{id}/appliance/uplinks/usageHistory); the rest sit at 15-55%
    us-plt2: 86

# -----------------------------------------------------------------------------
# Optional bridge to the core Arista lab (setup --link-fabric). Adds owners and
# a change window to the existing DC1 site so the fabric takes part in the same
# ownership/approval story. Only ADDS contact assignments and custom-field values.
# -----------------------------------------------------------------------------
fabric_link:
  site: dc1
  custom_fields:
    criticality: high
    change_window: "Sat 22:00-02:00 MT"
    source_system: manual
  contacts:
    owner: [priya-nair]
    approver: [dana-ortiz]
    change-window: [marcus-lee]
    escalation: [sam-whitaker]

# -----------------------------------------------------------------------------
# Role-based access for the demo (see rbac.py). Passwords come from
# DEMO_USER_PASSWORD, never from this file.
# -----------------------------------------------------------------------------
rbac:
  groups:
    plants-netops:
      description: "Network engineers - full edit on network objects"
      edit_actions: [add, change, delete]
      edit:
        - dcim.site
        - dcim.device
        - dcim.interface
        - dcim.cable
        - dcim.devicetype
        - ipam.vlan
        - ipam.prefix
        - ipam.ipaddress
        - tenancy.contact
        - tenancy.contactassignment
        - extras.journalentry
    plants-helpdesk:
      description: "L1/L2 - can reserve IPs and annotate, cannot reshape the network"
      edit_actions: [add, change]
      edit:
        - ipam.ipaddress
        - extras.journalentry
    plants-approvers:
      description: "Change approvers - read everything, comment via journal"
      edit_actions: [add]
      edit:
        - extras.journalentry
  users:
    demo.netops: {group: plants-netops, first_name: Demo, last_name: NetOps}
    demo.helpdesk: {group: plants-helpdesk, first_name: Demo, last_name: HelpDesk}
    demo.approver: {group: plants-approvers, first_name: Demo, last_name: Approver}

# -----------------------------------------------------------------------------
# Showcase: what the team asked for, shown inside NetBox.
#   saved_filters  -> appear in the NetBox filter bar ("Saved filters")
#   runbooks       -> EXAMPLE level-1 steps printed by `plants-triage`
#   post_change_checks -> EXAMPLE checks printed by `plants-impact`
# These are illustrations. Replace the wording with the team's real procedures.
# A saved filter only narrows a list if NetBox understands every parameter, and
# NetBox silently ignores the ones it does not, so `plants-views` checks each one.
# -----------------------------------------------------------------------------
showcase:
  saved_filters:
    - slug: plants-old-os
      name: "Plants: old operating systems (end of life)"
      object_type: dcim.device
      description: "Everything running an end-of-life OS, at every site"
      parameters: {tag: [legacy-os]}
    - slug: plants-xp-and-7
      name: "Plants: Windows XP and Windows 7"
      object_type: dcim.device
      description: "The machines the cyber assessment keeps undercounting"
      parameters: {platform: [windows-xp, windows-7]}
    - slug: plants-decommission
      name: "Plants: believed unneeded (decommission candidates)"
      object_type: dcim.device
      description: "Running, but nobody can say why - confirm the owner, then retire"
      parameters: {tag: [decommission-candidate]}
    - slug: plants-offline
      name: "Plants: offline devices"
      object_type: dcim.device
      description: "Status offline (the Meraki sync sets this from the dashboard)"
      parameters: {tag: [plants-demo], status: [offline]}
    - slug: plants-critical-devices
      name: "Plants: critical devices"
      object_type: dcim.device
      description: "Where a change needs the most care"
      parameters: {tag: [plants-demo], cf_criticality: [critical]}
    - slug: plants-ot-machines
      name: "Plants: plant-floor (OT) machines"
      object_type: dcim.device
      description: "HMIs and workstations on the OT networks"
      parameters: {tag: [ot-network]}
    - slug: plants-meraki-gear
      name: "Plants: Meraki-managed"
      object_type: dcim.device
      description: "What the Meraki dashboard knows about"
      parameters: {tag: [meraki]}
    - slug: plants-non-meraki-network
      name: "Plants: Juniper and Ubiquiti (spreadsheet today)"
      object_type: dcim.device
      description: "Network gear the Meraki portal cannot see"
      parameters: {manufacturer: [juniper, ubiquiti]}
    - slug: plants-from-spreadsheet
      name: "Plants: imported from a spreadsheet"
      object_type: dcim.device
      description: "Records that came from the asset register"
      parameters: {tag: [spreadsheet-import]}
    - slug: plants-from-meraki
      name: "Plants: added by the Meraki sync"
      object_type: dcim.device
      description: "Devices the dashboard had and NetBox did not"
      parameters: {tag: [meraki-sync]}
    - slug: plants-canary-sites
      name: "Plants: firmware canary sites"
      object_type: dcim.site
      description: "Low-impact sites that receive firmware first"
      parameters: {cf_firmware_canary: ["true"]}
    - slug: plants-critical-sites
      name: "Plants: critical sites"
      object_type: dcim.site
      description: "Sites where downtime is most expensive"
      parameters: {cf_criticality: [critical]}
    - slug: plants-ot-networks
      name: "Plants: OT networks"
      object_type: ipam.prefix
      description: "Every plant-floor network - the segmentation project's scope"
      parameters: {role: [ot]}

  # Placeholders: {name} {model} {serial} {ip} {status} {site} {platform} {owner}
  # {window} {criticality} {application} {upstream} {upstream_port}
  # {upstream_status} {siblings_note} {blast_count}
  # {blast_summary} {affected_owners}
  runbooks:
    ap:
      - "Find {name} (serial {serial}) in the Meraki dashboard and note whether it shows offline, alerting or dormant."
      - "Check the switch it plugs into: {upstream} {upstream_port} (status in NetBox: {upstream_status}). {siblings_note}."
      - "If several devices on that switch are down, suspect the switch or its uplink, not this access point."
      - "At the port: is the cable seated, is the port enabled, is PoE delivering power?"
      - "Power-cycle only that port, once, and wait three minutes. Do not reboot the switch."
      - "Still down: tell {owner}, then open a Meraki support case quoting serial {serial}."
    switch:
      - "Check {name} (serial {serial}) in the Meraki dashboard, and its uplink: {upstream} {upstream_port}."
      - "{blast_count} devices sit behind it ({blast_summary}). Their owners need to know before anything disruptive: {affected_owners}."
      - "Confirm the uplink cable or SFP is seated and the port on {upstream} is up."
      - "Do not reboot it without {owner}. Standing change window for this site: {window}."
      - "Still down: escalate to {owner} and open a Meraki support case quoting serial {serial}."
    # <kind>-<manufacturer slug> wins over <kind> for that vendor's gear.
    switch-juniper:
      - "{name} is a Juniper switch: the Meraki dashboard cannot see it. Try {ip} from the site's MX (Tools > Ping) or the jump host."
      - "{blast_count} devices sit behind it ({blast_summary}). Their owners need to know before anything disruptive: {affected_owners}."
      - "Check its uplink: {upstream} {upstream_port} (status in NetBox: {upstream_status}). Is the port up on that side?"
      - "Do not reboot it without {owner}. Standing change window for this site: {window}."
      - "Still down: escalate to {owner} and open a Juniper (JTAC) case with the chassis serial from the label."
    switch-ubiquiti:
      - "{name} is a Ubiquiti switch: look it up in the site's UniFi controller, not the Meraki dashboard. Try {ip} from the site's MX."
      - "{blast_count} devices sit behind it ({blast_summary}). Their owners need to know before anything disruptive: {affected_owners}."
      - "Check its uplink: {upstream} {upstream_port} (status in NetBox: {upstream_status})."
      - "Do not reboot it without {owner}. Standing change window for this site: {window}."
      - "Still down: escalate to {owner}; Ubiquiti support is by RMA, so check for a spare first."
    firewall:
      - "Check both WAN links for {name} in the Meraki dashboard. Is one down, or both?"
      - "{blast_count} devices lose connectivity if it is down ({blast_summary}). Owners to tell: {affected_owners}."
      - "Call {owner} now: this site is {criticality} criticality."
      - "If the unit itself is unreachable, open a Meraki support case quoting serial {serial}."
    server:
      - "Owner of {name}: {owner}. Application: {application}. Check with them before touching it."
      - "Check the switch it plugs into: {upstream} {upstream_port} (status in NetBox: {upstream_status})."
      - "Does {ip} answer? Does the application owner already know about an outage?"
      - "Standing change window for this site: {window}."
    endpoint:
      - "{name} is plant-floor equipment running {platform}. Tell {owner} first: it is production."
      - "Check the cable and the switch port: {upstream} {upstream_port} (status in NetBox: {upstream_status})."
      - "Do not reboot or patch without {owner}. Standing change window for this site: {window}."
    generic:
      - "Find {name} in the Meraki dashboard or the vendor console."
      - "Tell {owner}. Standing change window for this site: {window}."

  post_change_checks:
    firewall:
      - "Both WAN links up and passing traffic"
      - "Clients at the site can reach a corporate service and the internet"
    switch:
      - "Uplink up, no new errors on the ports"
      - "Clients and devices behind it reconnect"
    ap:
      - "Clients associate and get an address"
    server:
      - "The application answers, and its owner confirms"
    endpoint:
      - "The machine is reachable and its operator confirms"
    generic:
      - "The device answers and its owner confirms"
