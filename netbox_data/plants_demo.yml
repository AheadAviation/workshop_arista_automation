---
# =============================================================================
# Plants Demo Add-on - Sample Data
# =============================================================================
# OPTIONAL module. Layers a multi-site manufacturer (plants + distribution
# centers, Meraki-centric with some Juniper/Ubiquiti, owners/approvers/change
# windows) on top of the core Arista fabric lab WITHOUT modifying it.
#
# Everything here is fictional. Nothing carries the `containerlab` tag, so the
# Arista inventory, config generation and ContainerLab topology never see it.
#
# Load: python scripts/plants_demo/cli.py setup
# Audit: python scripts/plants_demo/cli.py audit
# Remove: python scripts/plants_demo/cli.py remove --yes
# =============================================================================

addon:
  tag: plants-demo
  domain: summitdoors.example

# -----------------------------------------------------------------------------
# Reference data (all new - none of these exist in the core lab)
# -----------------------------------------------------------------------------
tags:
  - {name: plants-demo, slug: plants-demo, color: 9e9e9e, description: "Created by the Plants Demo add-on"}
  - {name: meraki, slug: meraki, color: 4caf50, description: "Cisco Meraki managed"}
  - {name: juniper, slug: juniper, color: 3f51b5, description: "Juniper managed (non-Meraki)"}
  - {name: ubiquiti, slug: ubiquiti, color: 03a9f4, description: "Ubiquiti managed (non-Meraki)"}
  - {name: ot-network, slug: ot-network, color: ff9800, description: "Operational technology / plant floor"}
  - {name: legacy-os, slug: legacy-os, color: f44336, description: "Running an end-of-life operating system"}
  - {name: decommission-candidate, slug: decommission-candidate, color: 795548, description: "Believed unneeded - confirm owner then retire"}
  - {name: spreadsheet-import, slug: spreadsheet-import, color: 607d8b, description: "Imported from a spreadsheet by the Plants Demo add-on"}
  - {name: meraki-sync, slug: meraki-sync, color: 66bb6a, description: "Created by the Meraki sync from the dashboard"}
  - {name: scan-found, slug: scan-found, color: ffc107, description: "Answered a network scan; not yet identified"}

manufacturers:
  - {name: Cisco Meraki, slug: cisco-meraki}
  - {name: Juniper Networks, slug: juniper}
  - {name: Ubiquiti, slug: ubiquiti}
  - {name: Dell, slug: dell}
  - {name: Generic, slug: generic}

# Platforms with a manufacturer only allow that manufacturer's device types,
# so the Windows platforms intentionally have none.
platforms:
  - {name: Cisco Meraki (Cloud), slug: meraki-cloud, manufacturer: cisco-meraki}
  - {name: Junos, slug: junos, manufacturer: juniper}
  - {name: UniFi OS, slug: unifi-os, manufacturer: ubiquiti}
  - {name: Windows XP, slug: windows-xp}
  - {name: Windows 7, slug: windows-7}
  - {name: Windows 10, slug: windows-10}
  - {name: Windows Server 2012 R2, slug: windows-server-2012-r2}
  - {name: Windows Server 2016, slug: windows-server-2016}
  - {name: Windows Server 2019, slug: windows-server-2019}
  - {name: Windows Server 2022, slug: windows-server-2022}

device_roles:
  - {name: Firewall, slug: firewall, color: f44336}
  - {name: Access Switch, slug: access-switch, color: 2196f3}
  - {name: Wireless AP, slug: wireless-ap, color: 8bc34a}
  - {name: Server, slug: server, color: 607d8b}
  - {name: OT Workstation, slug: ot-workstation, color: ff9800}

prefix_roles:
  - {name: Management, slug: management, weight: 10}
  - {name: Corporate, slug: corporate, weight: 20}
  - {name: Voice, slug: voice, weight: 30}
  - {name: Guest, slug: guest, weight: 40}
  - {name: Servers, slug: servers, weight: 50}
  - {name: OT, slug: ot, weight: 60}

custom_field_choice_sets:
  - name: Criticality
    extra_choices: [[critical, Critical], [high, High], [medium, Medium], [low, Low]]
  - name: Source System
    extra_choices:
      - [spreadsheet, Spreadsheet]
      - [meraki-api, Meraki API]
      - [ninjaone, NinjaOne]
      - [manual, Manual]

# ui_visible=if-set keeps these hidden on the Arista devices, which never use them.
custom_fields:
  - {name: criticality, label: Criticality, type: select, choice_set: Criticality, object_types: [dcim.site, dcim.device], weight: 200}
  - {name: change_window, label: Change Window, type: text, object_types: [dcim.site], weight: 210, description: "Standing maintenance window (blank = negotiated each time)"}
  - {name: firmware_canary, label: Firmware Canary, type: boolean, object_types: [dcim.site], weight: 220, description: "Low-impact site that receives firmware first"}
  - {name: meraki_network_id, label: Meraki Network ID, type: text, object_types: [dcim.site], weight: 230}
  - {name: meraki_serial, label: Meraki Serial, type: text, object_types: [dcim.device], weight: 240}
  - {name: firmware_version, label: Firmware Version, type: text, object_types: [dcim.device], weight: 245, description: "As reported by the Meraki dashboard"}
  - {name: business_application, label: Business Application, type: text, object_types: [dcim.device], weight: 250}
  - {name: os_eol_date, label: OS End-of-Life Date, type: date, object_types: [dcim.device], weight: 260}
  - {name: source_system, label: Source System, type: select, choice_set: Source System, object_types: [dcim.site, dcim.device], weight: 270}
  - {name: depends_on, label: Depends On, type: multiobject, related_object_type: dcim.device, object_types: [dcim.device], weight: 280, description: "Systems this one needs to talk to (the flows a firewall must allow)"}

# -----------------------------------------------------------------------------
# Organization
# -----------------------------------------------------------------------------
regions:
  - {name: North America, slug: north-america}
  - {name: United States, slug: united-states, parent: north-america}
  - {name: Canada, slug: canada, parent: north-america}
  - {name: Mexico, slug: mexico, parent: north-america}
  - {name: EMEA, slug: emea}
  - {name: United Kingdom, slug: united-kingdom, parent: emea}
  - {name: APAC, slug: apac}
  - {name: China, slug: china, parent: apac}
  - {name: New Zealand, slug: new-zealand, parent: apac}

tenant_groups:
  - {name: Business Units, slug: business-units}

tenants:
  - {name: Corporate, slug: corporate, group: business-units}
  - {name: Residential Doors, slug: residential-doors, group: business-units}
  - {name: Commercial Doors, slug: commercial-doors, group: business-units}
  - {name: Logistics, slug: logistics, group: business-units}

contact_groups:
  - {name: IT Infrastructure, slug: it-infrastructure}
  - {name: Applications, slug: applications}
  - {name: Plant Operations, slug: plant-operations}

# Roles are what let an approval workflow ask "who do I have to talk to?"
contact_roles:
  - {name: Owner, slug: owner}
  - {name: Approver, slug: approver}
  - {name: Change Window Contact, slug: change-window}
  - {name: Escalation, slug: escalation}

contacts:
  dana-ortiz: {name: Dana Ortiz, group: it-infrastructure, title: Director of IT}
  priya-nair: {name: Priya Nair, group: it-infrastructure, title: Senior Network Engineer}
  marcus-lee: {name: Marcus Lee, group: it-infrastructure, title: Network Engineer}
  nora-fields: {name: Nora Fields, group: it-infrastructure, title: Systems Administrator}
  sam-whitaker: {name: Sam Whitaker, group: it-infrastructure, title: Service Desk Lead}
  elena-petrova: {name: Elena Petrova, group: applications, title: ERP Applications Lead}
  raj-patel: {name: Raj Patel, group: applications, title: Manufacturing Systems Owner}
  carla-mendez: {name: Carla Mendez, group: plant-operations, title: Plant Manager - Columbus}
  tom-brennan: {name: Tom Brennan, group: plant-operations, title: Plant Manager - Greenville}
  joanne-kim: {name: Joanne Kim, group: plant-operations, title: Plant Manager - Tulsa}
  ken-ito: {name: Ken Ito, group: plant-operations, title: Distribution Manager - Memphis}
  bea-lopez: {name: Bea Lopez, group: plant-operations, title: Distribution Manager - Reno}
  pat-oneill: {name: Pat Oneill, group: plant-operations, title: Plant Manager - Mississauga}
  luis-herrera: {name: Luis Herrera, group: plant-operations, title: Plant Manager - Monterrey}
  ana-gutierrez: {name: Ana Gutierrez, group: plant-operations, title: Plant Manager - Tijuana}
  harry-clarke: {name: Harry Clarke, group: plant-operations, title: Site Lead - Telford}
  wei-zhang: {name: Wei Zhang, group: plant-operations, title: Site Lead - Suzhou}
  aroha-ngata: {name: Aroha Ngata, group: plant-operations, title: Warehouse Manager - Auckland}

# -----------------------------------------------------------------------------
# Device types. `group` drives cabling: lan (firewall downlinks), uplink
# (toward the network core), access (host-facing), mgmt (management IP).
# -----------------------------------------------------------------------------
device_types:
  mx85:
    manufacturer: cisco-meraki
    model: MX85
    slug: meraki-mx85
    kind: firewall
    role: firewall
    platform: meraki-cloud
    tags: [meraki]
    interfaces:
      - {name: WAN1, type: 1000base-t, group: wan}
      - {name: WAN2, type: 1000base-t, group: wan}
      - {pattern: "Port {n}", start: 3, count: 8, type: 1000base-t, group: lan}
      - {name: Management, type: virtual, group: mgmt}
  mx68:
    manufacturer: cisco-meraki
    model: MX68
    slug: meraki-mx68
    kind: firewall
    role: firewall
    platform: meraki-cloud
    tags: [meraki]
    interfaces:
      - {name: WAN1, type: 1000base-t, group: wan}
      - {name: WAN2, type: 1000base-t, group: wan}
      - {pattern: "Port {n}", start: 3, count: 10, type: 1000base-t, group: lan}
      - {name: Management, type: virtual, group: mgmt}
  ms120-24p:
    manufacturer: cisco-meraki
    model: MS120-24P
    slug: meraki-ms120-24p
    kind: switch
    role: access-switch
    platform: meraki-cloud
    tags: [meraki]
    interfaces:
      - {pattern: "Port {n}", start: 1, count: 24, type: 1000base-t, group: access}
      - {pattern: "Uplink {n}", start: 25, count: 4, type: 1000base-x-sfp, group: uplink}
      - {name: Management, type: virtual, group: mgmt}
  ms225-48lp:
    manufacturer: cisco-meraki
    model: MS225-48LP
    slug: meraki-ms225-48lp
    kind: switch
    role: access-switch
    platform: meraki-cloud
    tags: [meraki]
    interfaces:
      - {pattern: "Port {n}", start: 1, count: 48, type: 1000base-t, group: access}
      - {pattern: "Uplink {n}", start: 49, count: 4, type: 10gbase-x-sfpp, group: uplink}
      - {name: Management, type: virtual, group: mgmt}
  mr46:
    manufacturer: cisco-meraki
    model: MR46
    slug: meraki-mr46
    kind: ap
    role: wireless-ap
    platform: meraki-cloud
    tags: [meraki]
    interfaces:
      - {name: eth0, type: 2.5gbase-t, group: uplink}
      - {name: Management, type: virtual, group: mgmt}
  ex2300-24p:
    manufacturer: juniper
    model: EX2300-24P
    slug: juniper-ex2300-24p
    kind: switch
    role: access-switch
    platform: junos
    tags: [juniper]
    interfaces:
      - {pattern: "ge-0/0/{n}", start: 0, count: 24, type: 1000base-t, group: access}
      - {pattern: "xe-0/1/{n}", start: 0, count: 4, type: 10gbase-x-sfpp, group: uplink}
      - {name: me0, type: 1000base-t, group: mgmt, mgmt_only: true}
  usw-pro-24-poe:
    manufacturer: ubiquiti
    model: USW-Pro-24-PoE
    slug: ubiquiti-usw-pro-24-poe
    kind: switch
    role: access-switch
    platform: unifi-os
    tags: [ubiquiti]
    interfaces:
      - {pattern: "Port {n}", start: 1, count: 24, type: 1000base-t, group: access}
      - {pattern: "SFP+ {n}", start: 1, count: 2, type: 10gbase-x-sfpp, group: uplink}
      - {name: Management, type: virtual, group: mgmt}
  poweredge-r650:
    manufacturer: dell
    model: PowerEdge R650
    slug: dell-poweredge-r650
    kind: server
    role: server
    interfaces:
      - {name: iDRAC, type: 1000base-t, group: mgmt, mgmt_only: true}
      - {name: NIC1, type: 10gbase-x-sfpp, group: uplink}
      - {name: NIC2, type: 10gbase-x-sfpp, group: uplink}
  hmi-workstation:
    manufacturer: generic
    model: HMI Workstation
    slug: generic-hmi-workstation
    kind: endpoint
    role: ot-workstation
    interfaces:
      - {name: eth0, type: 1000base-t, group: uplink}

# -----------------------------------------------------------------------------
# Site layout. Each profile expands into fw/sw/ap devices named
# <site>-fw01, <site>-sw01, <site>-ap01 (vendor-neutral naming on purpose).
# -----------------------------------------------------------------------------
profiles:
  large:
    firewall: {type: mx85, count: 2}
    switch: {type: ms225-48lp, count: 3}
    ap: {type: mr46, count: 6}
    extra_vlans: [50]
  medium:
    firewall: {type: mx85, count: 1}
    switch: {type: ms120-24p, count: 2}
    ap: {type: mr46, count: 4}
  small:
    firewall: {type: mx68, count: 1}
    switch: {type: ms120-24p, count: 1}
    ap: {type: mr46, count: 2}

# vid -> (name, prefix role). `plants` also get OT; every site gets the rest.
vlans:
  common:
    - {vid: 10, name: CORP, role: corporate}
    - {vid: 20, name: VOICE, role: voice}
    - {vid: 30, name: GUEST, role: guest}
    - {vid: 99, name: MGMT, role: management}
  plant_only:
    - {vid: 100, name: OT, role: ot}
  extra:
    50: {name: SERVERS, role: servers}

