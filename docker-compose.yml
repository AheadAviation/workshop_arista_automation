---
# NetBox + Arista ContainerLab Demo
# Docker Compose for NetBox Stack + Ansible Automation
#
# Usage:
#   docker compose up -d                    # Start NetBox stack
#   docker compose logs -f netbox           # View NetBox logs
#   docker compose run --rm ansible <cmd>   # Run Ansible commands
#   docker compose down -v                  # Remove everything
#
# Ansible Examples:
#   docker compose run --rm ansible python scripts/full_import.py
#   docker compose run --rm ansible ansible-playbook playbooks/generate_configs.yml
#   docker compose run --rm ansible ansible-inventory --list

services:
  # ==========================================================================
  # NetBox Application
  # ==========================================================================
  netbox:
    build:
      # Context is the repo root so the image can bundle the local
      # plugins/netbox_ztp_portal package alongside the pinned plugins.
      context: .
      dockerfile: docker/netbox/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database - using correct env var names for netbox-docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: netbox
      DB_WAIT_DEBUG: 1
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      REDIS_CACHE_HOST: redis
      REDIS_CACHE_PORT: 6379
      REDIS_CACHE_DATABASE: 1
      REDIS_SSL: "false"
      REDIS_CACHE_SSL: "false"
      # NetBox settings
      SECRET_KEY: changeme_this_is_not_secure_for_demo_only_1234567890
      ALLOWED_HOSTS: "*"
      SUPERUSER_NAME: admin
      SUPERUSER_EMAIL: admin@example.com
      SUPERUSER_PASSWORD: admin
      SUPERUSER_API_TOKEN: 0123456789abcdef0123456789abcdef01234567
      SKIP_SUPERUSER: "false"
      # Skip CSRF for local dev
      CSRF_TRUSTED_ORIGINS: http://localhost:8888 http://127.0.0.1:8888
      CORS_ORIGIN_ALLOW_ALL: "true"
      # Login settings.
      #
      # This is `true`, and it must stay true. It was `false` for the original workshop, which
      # is fine for a lab where the only thing behind the UI is seeded demo data. It is NOT
      # fine now that a plugin on this instance can push configuration to real switches: with
      # LOGIN_REQUIRED false, Django treats every request as an anonymous superuser, so an
      # unauthenticated visitor could read every switch's running config *and* trigger a
      # config push. That is unauthenticated remote control of network devices, not a cosmetic
      # leak. `/plugins/ops/` is the page that makes it dangerous.
      LOGIN_REQUIRED: "true"
      # The workbench engine reads NetBox's own REST API through these. Inside the container
      # the app listens on 8080 (8888 is only the host-side published port).
      NETBOX_URL: http://localhost:8080
      NETBOX_TOKEN: 0123456789abcdef0123456789abcdef01234567
      # The engine's device driver reaches the lab through the scoped Docker proxy, never a
      # socket. It shells out to `docker exec`; this tells it which daemon to talk to.
      DOCKER_HOST: tcp://docker-proxy:2375
    ports:
      - "8888:8080"
    volumes:
      - netbox-media:/opt/netbox/netbox/media
      - netbox-reports:/opt/netbox/netbox/reports
      - netbox-scripts:/opt/netbox/netbox/scripts
      # Plugin configuration
      - ./docker/netbox/configuration/plugins.py:/etc/netbox/config/plugins.py:ro
      # ZTP portal plugin source (editable-installed in the image); bind-mounted
      # so code changes are picked up on container restart without a rebuild.
      - ./plugins/netbox_ztp_portal/netbox_ztp_portal:/opt/netbox/plugins/netbox_ztp_portal/netbox_ztp_portal:ro
      # NetBox Ops plugin and the workbench engine it is a surface on. Bind-mounted for the
      # same reason: restart, don't rebuild, while iterating.
      #
      # The engine is installed editable from /opt/netbox/engine, so mounting the source back
      # over that same path keeps the install valid AND picks up edits. Mounting it anywhere
      # else would leave the request path importing a stale copy — which is exactly what
      # happened once and produced a 500 with nothing in the logs.
      - ./plugins/netbox_ops/netbox_ops:/opt/netbox/plugins/netbox_ops/netbox_ops:ro
      - ./workbench:/opt/netbox/engine/workbench:ro
      # Rendered configs, so the plugin can push one to a device and prove it took. Read-only:
      # rendering runs in the ansible container and the plugin only ever reads the result.
      - ./output/configs:/opt/netbox/configs:ro
    healthcheck:
      # `/login/`, not `/api/`. The API endpoint now returns 403 to an unauthenticated request
      # (it did not before the plugin's views were locked down), so a `curl -f` against it made a
      # perfectly healthy NetBox report "unhealthy" and blocked anything waiting on it — which is
      # how the bootstrap service failed. `/login/` answers 200 without credentials and proves
      # what a healthcheck should prove: the app is up and serving.
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://localhost:8080/login/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      default:
        aliases:
          - netbox
    restart: unless-stopped

  # ==========================================================================
  # NetBox Background Worker
  # ==========================================================================
  netbox-worker:
    build:
      context: .
      dockerfile: docker/netbox/Dockerfile
    depends_on:
      netbox:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: netbox
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      REDIS_CACHE_HOST: redis
      REDIS_CACHE_PORT: 6379
      REDIS_CACHE_DATABASE: 1
      REDIS_SSL: "false"
      REDIS_CACHE_SSL: "false"
      SECRET_KEY: changeme_this_is_not_secure_for_demo_only_1234567890
    command: /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py rqworker
    restart: unless-stopped

  # ==========================================================================
  # NetBox Bootstrap (one-shot, runs after NetBox is healthy)
  # ==========================================================================
  # Installs the NetBox ConfigTemplate that makes the native "Render Config" tab work, and
  # assigns it to the Arista devices.
  #
  # Why a separate one-shot service rather than doing it inside the plugin: a Django app must not
  # write database rows at import time — it runs on every worker and would race itself. A
  # container that runs once, after the app is up, is the right shape.
  #
  # Idempotent, so it is safe on every `up`. This is what makes "delete everything and it just
  # works" true: no manual step, no template to import by hand.
  netbox-bootstrap:
    build:
      context: .
      dockerfile: docker/netbox/Dockerfile
    depends_on:
      netbox:
        condition: service_healthy
    # A plain Python entrypoint, not `manage.py shell`: this script imports the fabric first
    # (via the repo's own importer) and only then installs the template, because a template
    # created before any device exists has nothing to assign itself to. That ordering was the
    # actual bug — `Render Config` said "no template assigned" on a fresh stack.
    entrypoint: ["/opt/netbox/venv/bin/python", "/opt/netbox/templates/bootstrap.py"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: netbox
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: changeme_this_is_not_secure_for_demo_only_1234567890
      ALLOWED_HOSTS: "*"
      # The importer talks to NetBox over its own API, from inside the network.
      NETBOX_URL: http://netbox:8080
      NETBOX_TOKEN: 0123456789abcdef0123456789abcdef01234567
    volumes:
      # The repo, so the importer and its data files are available.
      - .:/opt/netbox/repo:ro
      - ./plugins/netbox_ops/netbox_ops:/opt/netbox/plugins/netbox_ops/netbox_ops:ro
      - ./workbench:/opt/netbox/engine/workbench:ro
    networks:
      default:
        aliases:
          - netbox-bootstrap
    restart: "no"

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: netbox
      POSTGRES_DB: netbox
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - postgres
    restart: unless-stopped

  # ==========================================================================
  # Redis Cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - redis
    restart: unless-stopped

  # ==========================================================================
  # Ansible Automation Container
  # ==========================================================================
  ansible:
    build:
      context: .
      dockerfile: docker/ansible/Dockerfile
    depends_on:
      netbox:
        condition: service_healthy
    environment:
      NETBOX_URL: http://netbox:8080
      NETBOX_TOKEN: 0123456789abcdef0123456789abcdef01234567
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_PYTHON_INTERPRETER: auto_silent
      CEOS_IMAGE: ceos:4.32.0F
      # Optional: password for the Plants Demo add-on users (lab default if empty)
      DEMO_USER_PASSWORD: "${DEMO_USER_PASSWORD:-}"
      # Optional: a real Meraki dashboard for 'plants-meraki --base-url ...' (the built-in mock needs none)
      MERAKI_API_KEY: "${MERAKI_API_KEY:-}"
      MERAKI_ORG_ID: "${MERAKI_ORG_ID:-}"
    volumes:
      - ./scripts:/ansible/scripts:ro
      - ./playbooks:/ansible/playbooks:ro
      - ./roles:/ansible/roles:ro
      - ./inventory:/ansible/inventory:ro
      - ./group_vars:/ansible/group_vars:ro
      - ./netbox_data:/ansible/netbox_data:ro
      - ./filter_plugins:/ansible/filter_plugins:ro
      - ./clab:/ansible/clab:rw
      - ./output:/ansible/output:rw
      - ./.ansible-lint:/ansible/.ansible-lint:ro
      - ./.yamllint.yml:/ansible/.yamllint.yml:ro
      - ./ansible.cfg:/ansible/ansible.cfg:ro
      # Dual-DC AVD track. Read-write so eos_designs can emit intended configs.
      - ./labs/l3ls-dual-dc:/labs/l3ls-dual-dc:rw
    working_dir: /ansible
    stdin_open: true
    tty: true

  # ==========================================================================
  # Scoped Docker Proxy (INIT-002/SPEC-002)
  # ==========================================================================
  # The Ops plugin needs to see the containerlab topology and drive deploy/destroy.
  # Mounting /var/run/docker.sock into NetBox would give that container root on the host,
  # which is the single worst thing a hospital CISO could see in a demo. This proxy exposes
  # only the read endpoints plus container start/stop; there is no exec, no build, no pull.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    environment:
      # Read-only view of containers and the daemon.
      CONTAINERS: 1
      INFO: 1
      VERSION: 1
      EVENTS: 1
      # Everything else stays closed. Deliberately: no EXEC, no BUILD, no IMAGES, no POST
      # beyond start/stop, no VOLUMES, no NETWORKS.
      IMAGES: 0
      EXEC: 0
      BUILD: 0
      POST: 1
      VOLUMES: 0
      NETWORKS: 0
      SYSTEM: 0
      PLUGINS: 0
      SWARM: 0
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      default:
        aliases:
          - docker-proxy
    restart: unless-stopped

  # ==========================================================================
  # Lab Runner (INIT-002/SPEC-002)
  # ==========================================================================
  # A two-verb HTTP wrapper around `containerlab deploy|destroy`. NetBox calls this instead of
  # holding Docker access, which keeps the plugin's security posture: the only service with the
  # Docker socket (via the proxy below) is this one, and the worst it can be asked to do is
  # start or stop the demo topology.
  lab-runner:
    build:
      context: ./docker/lab-runner
    environment:
      REQUEST_TIMEOUT: "900"
    volumes:
      # The repo, so `docker compose run clab` finds the compose file and the clab service.
      # The topology lives under ./clab, which the clab service mounts at /clab/topology.
      - .:/compose:ro
      # The same Docker access the clab service already has, which is what makes deploy possible.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      default:
        aliases:
          - lab-runner
    restart: unless-stopped

  # ==========================================================================
  # ContainerLab Runner (Privileged container for full networking)
  # ==========================================================================
  clab:
    build:
      context: .
      dockerfile: docker/clab-runner/Dockerfile
    privileged: true
    pid: host
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./clab:/clab/topology:rw
      - ./labs/l3ls-dual-dc/clab:/clab/dual-dc:rw
      - ./output/configs:/clab/configs:ro
    working_dir: /clab
    stdin_open: true
    tty: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
  netbox-media:
  netbox-reports:
  netbox-scripts:
  postgres-data:
  redis-data:

# =============================================================================
# Networks
# =============================================================================
networks:
  default:
    name: netbox-arista-lab
