# NetBox Discovery (Orb Agent) - scheduled policies
# =============================================================================
# Targets the demo fabric by management IP. Devices carry the `demo-` prefix so
# this fabric never collides with another lab documented in the same NetBox.
#
# Discovery is the source of truth for this demo: NetBox starts empty (or with
# only stale entries), Orb Agent reads the switches, and the results land in
# NetBox Cloud -> Diode -> Assurance.

orb:
  config_manager:
    active: local
  backends:
    common:
      diode:
        target: ${DIODE_TARGET}
        client_id: ${DIODE_CLIENT_ID}
        client_secret: ${DIODE_CLIENT_SECRET}
        agent_name: netbox-demo-local-orb
        # NetBox Cloud Diode is a managed endpoint; keep the default verification.
    device_discovery:
    snmp_discovery:

  policies:
    device_discovery:
      demo_fabric_napalm:
        config:
          schedule: "0 */6 * * *"
          options:
            # Capture the running configuration so NetBox holds evidence of what
            # the switch actually had, which is what makes the drift story real.
            capture_running_config: true
            sanitize_config: true
            discover_vrfs: true
            create_unknown_vlans: true
            emit_prefix_vlan: svi-name
            emit_lag_membership: true
            port_scan_ports: [22, 80, 443]
            port_scan_timeout: 1.0
          defaults:
            site: netbox-demo
            role: switch
            tags: [netbox-demo, discovered]
            description: "Discovered by NetBox Discovery (netbox-demo)"
            interface_patterns:
              - match: "^Loopback"
                type: virtual
              - match: "^Management"
                type: 1000base-t
              - match: "^Vlan"
                type: virtual
              - match: "^Port-Channel"
                type: lag
              - match: "^Ethernet"
                type: 10gbase-x-sfpp
        scope:
          - driver: eos
            hostname: 172.31.30.11
            username: ${EOS_USER}
            password: ${EOS_PASS}
          - driver: eos
            hostname: 172.31.30.12
            username: ${EOS_USER}
            password: ${EOS_PASS}
          - driver: eos
            hostname: 172.31.30.21
            username: ${EOS_USER}
            password: ${EOS_PASS}
          - driver: eos
            hostname: 172.31.30.22
            username: ${EOS_USER}
            password: ${EOS_PASS}
          - driver: eos
            hostname: 172.31.30.23
            username: ${EOS_USER}
            password: ${EOS_PASS}
          - driver: eos
            hostname: 172.31.30.24
            username: ${EOS_USER}
            password: ${EOS_PASS}

    # SNMP adds hardware, interface counters and MAC evidence that NAPALM alone
    # does not surface. Optional: remove this policy if SNMP is not wanted.
    snmp_discovery:
      demo_fabric_snmp:
        config:
          schedule: "15 */6 * * *"
          defaults:
            site: netbox-demo
            role: switch
            tags: [netbox-demo, discovered]
        scope:
          targets:
            - host: 172.31.30.11
            - host: 172.31.30.12
            - host: 172.31.30.21
            - host: 172.31.30.22
            - host: 172.31.30.23
            - host: 172.31.30.24
          authentication:
            protocol_version: SNMPv2c
            community: ${SNMP_COMMUNITY}
